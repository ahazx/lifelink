<!-- 本工作台通过 WorkBuddy「资料库」skill 搭建、存储和部署 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>日常集 · 生活工作台</title>
<style>
  :root{
    --bg:#F6F3EE; --surface:#FFFFFF; --surface2:#FBF9F5; --ink:#2A2724; --muted:#9A9186;
    --line:#ECE6DC; --accent:#B26A4F; --accent-soft:#F3E7E0; --green:#5E8C6A; --red:#C2543F;
    --blue:#6B8CAE; --gold:#C9A24B; --shadow:0 1px 2px rgba(42,39,36,.04),0 8px 24px rgba(42,39,36,.04);
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .serif{font-family:"Songti SC","STSong",Georgia,"Times New Roman",serif}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
  a{color:var(--accent);text-decoration:none}
  h1,h2,h3{margin:0;font-weight:600}
  ::-webkit-scrollbar{height:6px;width:6px}::-webkit-scrollbar-thumb{background:#ddd5c9;border-radius:3px}

  .app{display:flex;min-height:100vh}
  /* Sidebar */
  .sidebar{width:236px;flex:0 0 236px;background:var(--surface2);border-right:1px solid var(--line);
    padding:26px 18px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#C98B6E,#B26A4F);
    display:flex;align-items:center;justify-content:center;color:#fff}
  .brand .name{font-size:19px;letter-spacing:1px}
  .brand .sub{font-size:11px;color:var(--muted);margin-top:1px}
  .nav{margin-top:26px;display:flex;flex-direction:column;gap:2px}
  .nav button{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;color:#6f685e;
    font-size:14.5px;transition:.15s;text-align:left;width:100%}
  .nav button:hover{background:#f0ebe2;color:var(--ink)}
  .nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .nav button svg{width:18px;height:18px;flex:0 0 18px}
  .side-foot{margin-top:24px;font-size:11px;color:var(--muted);line-height:1.7;border-top:1px solid var(--line);padding-top:16px}
  /* Main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(246,243,238,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:14px}
  .topbar .htitle{font-size:18px;font-weight:600}
  .topbar .hdate{font-size:12.5px;color:var(--muted);margin-top:1px}
  .topbar .spacer{flex:1}
  .sync{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);
    padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
  .sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:.2s}
  .sync.ok .dot{background:var(--green)}
  .sync.loading .dot{background:var(--gold);animation:pulse 1s infinite}
  .sync.error .dot{background:var(--red)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
    display:flex;align-items:center;justify-content:center;color:#6f685e}
  .iconbtn:hover{background:#f0ebe2}
  .iconbtn svg{width:18px;height:18px}
  .hamburger{display:none}
  .main-inner{max-width:1000px;width:100%;margin:0 auto;padding:26px 22px 80px}
  .view{display:none;animation:fade .25s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* Generic */
  .greet{font-size:13px;color:var(--muted);letter-spacing:.5px}
  .greet b{color:var(--ink);font-weight:600}
  .section-title{display:flex;align-items:baseline;gap:10px;margin:30px 0 14px}
  .section-title h2{font-size:16px;letter-spacing:.5px}
  .section-title .en{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
  .section-title .more{margin-left:auto;font-size:12.5px;color:var(--muted)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;box-shadow:var(--shadow)}
  .grid{display:grid;gap:14px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .stat .k{font-size:12px;color:var(--muted);margin-bottom:6px}
  .stat .v{font-size:24px;font-weight:600;letter-spacing:.5px}
  .stat .v small{font-size:13px;color:var(--muted);font-weight:400;margin-left:3px}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .muted{color:var(--muted)} .ac{color:var(--accent)}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;
    background:#f0ebe2;color:#6f685e}
  .pill.green{background:#e7f0e9;color:var(--green)} .pill.red{background:#f7e6e1;color:var(--red)}
  .pill.blue{background:#e8eef4;color:var(--blue)} .pill.gold{background:#f6efdd;color:#a9842f}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:11px;
    font-size:14px;background:var(--accent);color:#fff;transition:.15s;border:1px solid transparent}
  .btn:hover{background:#9f5d44}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:#f0ebe2}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
  .btn:disabled{opacity:.5;cursor:default}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12.5px;color:var(--muted)}
  .field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--surface2);outline:none;transition:.15s;width:100%}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:#fff}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
  .form-actions{display:flex;gap:10px;margin-top:4px}
  .bar{height:9px;border-radius:6px;background:#efe9e0;overflow:hidden}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#C98B6E,#B26A4F);border-radius:6px;transition:width .5s}
  .bar.green > i{background:linear-gradient(90deg,#7BAE86,#5E8C6A)}
  .empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:13.5px;border:1px dashed var(--line);border-radius:14px;background:var(--surface2)}
  .empty svg{width:30px;height:30px;opacity:.4;margin-bottom:8px}
  .errbox{padding:22px;border:1px solid #f0d4cc;border-radius:14px;background:#fdf3f0;color:#a8442f;
    text-align:center;font-size:13.5px}
  .errbox button{margin-top:12px}
  .list{display:flex;flex-direction:column}
  .li{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
  .li:last-child{border-bottom:none}
  .li .main{flex:1;min-width:0}
  .li .t{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .s{font-size:12px;color:var(--muted);margin-top:2px}
  .li .amt{font-size:15px;font-weight:600;white-space:nowrap}
  .li .acts{display:flex;gap:6px;flex:0 0 auto}
  .mini{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);
    display:flex;align-items:center;justify-content:center;color:#8a8378}
  .mini:hover{background:#f0ebe2;color:var(--ink)}
  .mini svg{width:15px;height:15px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{padding:6px 13px;border-radius:20px;font-size:13px;background:var(--surface);border:1px solid var(--line);color:#6f685e}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .seg{display:inline-flex;background:#efe9e0;border-radius:10px;padding:3px}
  .seg button{padding:6px 14px;border-radius:8px;font-size:13px;color:#6f685e}
  .seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .timeline{position:relative;padding-left:18px}
  .timeline:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .tl-item{position:relative;padding:9px 0}
  .tl-item:before{content:"";position:absolute;left:-16px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .tl-item .tl-d{font-size:12px;color:var(--muted)}
  .tl-item .tl-t{font-size:14px}
  .heat{display:grid;grid-template-columns:repeat(15,1fr);gap:3px}
  .heat i{aspect-ratio:1;border-radius:3px;background:#F0ECE4}
  .heat i.l1{background:#DCE8D5}.heat i.l2{background:#B9D3A8}.heat i.l3{background:#8FBE83}.heat i.l4{background:#5E8C6A}
  .cover{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#e9e2d6,#d8cfc0);
    display:flex;align-items:flex-end;padding:10px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
  .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cover .ct{position:relative;font-size:13px;font-weight:600;line-height:1.3}
  .stars{color:var(--gold);letter-spacing:1px;font-size:13px}
  .stars .off{color:#e0d8cb}
  .drawer-mask{display:none;position:fixed;inset:0;background:rgba(42,39,36,.35);z-index:40}
  .drawer-mask.open{display:block}
  @media(max-width:860px){
    .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:.25s;box-shadow:var(--shadow)}
    .sidebar.open{transform:none}
    .hamburger{display:flex}
    .main-inner{padding:18px 14px 90px}
    .topbar{padding:12px 14px}
    .heat{grid-template-columns:repeat(10,1fr)}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:var(--surface);
      border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));overflow-x:auto}
    .bottom-nav button{flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:3px;
      font-size:10.5px;color:#9a9186;padding:5px 2px}
    .bottom-nav button.active{color:var(--accent)}
    .bottom-nav button svg{width:20px;height:20px}
  }
  @media(min-width:861px){.bottom-nav{display:none}}
  /* Toast */
  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);z-index:80;
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:24px;font-size:13.5px;opacity:0;
    transition:.25s;pointer-events:none;box-shadow:var(--shadow);max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:#a8442f}
  #toast.ok{background:#3f7a52}
  /* Loading skeleton */
  .skel{height:14px;background:linear-gradient(90deg,#eee7dc,#f5f0e8,#eee7dc);background-size:200% 100%;
    border-radius:6px;animation:sk 1.2s infinite}
  @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo serif">日</div>
      <div><div class="name serif">日常集</div><div class="sub">生活工作台</div></div>
    </div>
    <nav class="nav" id="nav">
      <button data-view="overview" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>今日概览</button>
      <button data-view="finance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7h18M3 12h18M3 17h12"/></svg>记账理财</button>
      <button data-view="habits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 6L9 17l-5-5"/></svg>习惯健康</button>
      <button data-view="fitness"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 14c2-6 6-6 8 0s6 6 8 0"/><path d="M3 9h4M17 9h4"/></svg>减脂健身</button>
      <button data-view="schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>日程统筹</button>
      <button data-view="wishlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 8h18l-1.5 11a2 2 0 0 1-2 1.8H6.5a2 2 0 0 1-2-1.8z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg>待买清单</button>
      <button data-view="media"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/></svg>书影音收藏</button>
    </nav>
    <div class="side-foot">
      数据存于资料库云端<br>多设备实时同步<br>新增 · 修改 · 删除即时写回
    </div>
  </aside>
  <div class="drawer-mask" id="drawerMask"></div>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <button class="iconbtn hamburger" id="hamburger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div>
        <div class="htitle" id="viewTitle">今日概览</div>
        <div class="hdate" id="viewDate"></div>
      </div>
      <div class="spacer"></div>
      <div class="sync loading" id="sync"><span class="dot"></span><span id="syncText">同步中</span></div>
      <button class="iconbtn" data-act="export" title="导出全部数据（JSON 备份到本地）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg></button>
      <button class="iconbtn" data-act="refresh" title="刷新数据"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 11a8 8 0 1 0-2 5.5M20 5v6h-6"/></svg></button>
    </div>

    <div class="main-inner">
      <section class="view active" id="view-overview"></section>
      <section class="view" id="view-finance"></section>
      <section class="view" id="view-habits"></section>
      <section class="view" id="view-fitness"></section>
      <section class="view" id="view-schedule"></section>
      <section class="view" id="view-wishlist"></section>
      <section class="view" id="view-media"></section>
    </div>
  </div>
</div>
<div class="bottom-nav" id="bottomNav"></div>
<div id="toast"></div>

<script>
(function(){
'use strict';

/* ============ 数据表绑定（写死的 databaseId，来自资料库建表返回） ============ */
function db(){return (window.__SMART_PAGE__ && window.__SMART_PAGE__.database) ? window.__SMART_PAGE__.database : null;}
var DB = {
  finance:'12aw7XCYhSfd2y1JqbKHlW', budget:'UfPywbZsBCmJFTn6CMY9ej', habits:'U6nVaI1E5SCq0jkgjRg5ae',
  habitlog:'UBCxSQT8oUXVxT3bPBMCaD', fitness:'KsZpee9WBLv6efAuglqmqX', goal:'t4qcxdZVs29QASeH8XdStM',
  schedule:'mRuhyUDSIugbBFCobw4ipv', wishlist:'ZVfFEXQ4um0cUAI8hEzspw', media:'IyDISJ94DK2ij01hpCrldT',
  workout:'WreRBs0xcQVeIHjoqQPkVt'
};
var OPT = {
  type:['收入','支出'],
  cat:['吃饭','交通','购物','娱乐','房租','看病','学习','其他','工资','奖金','兼职','理财'],
  mode:['勾选','计数','数值'],
  week:['周一','周二','周三','周四','周五','周六','周日'],
  schCat:['工作','生活','家庭','个人','其他'],
  wlCat:['食品','日用品','数码','衣物','其他'],
  mediaType:['电影','番剧','电视剧','书','音乐'],
  mediaStatus:['想看','在看','看完','弃了']
};
var CATCOL = {'吃饭':'#E0A458','交通':'#6B8CAE','购物':'#C2799B','娱乐':'#8A9A7B','房租':'#B26A4F',
  '看病':'#C2543F','学习':'#6E8B9E','其他':'#B0A99E','工资':'#5E8C6A','奖金':'#5E8C6A','兼职':'#7BA088','理财':'#7BA088'};
var C = {ink:'#2A2724',muted:'#9A9186',line:'#ECE6DC',accent:'#B26A4F',green:'#5E8C6A',red:'#C2543F',blue:'#6B8CAE',gold:'#C9A24B'};

/* ============ 内存数据仓 ============ */
var store = {finance:[],budget:[],habits:[],habitlog:[],fitness:[],goal:[],schedule:[],wishlist:[],media:[],workout:[]};
var errState = {}; // key -> true 表示该表加载失败
var currentView = 'overview';
var state = {finCat:'全部',schFilter:'全部',wlFilter:'待买',mdView:'wall',mdStatus:'全部',mdStar:'全部'};

/* ============ 工具 ============ */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return n<10?'0'+n:''+n;}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dkey(iso){return (iso||'').slice(0,10);}
function nowMonth(){return todayStr().slice(0,7);}
function addDays(ds,n){var d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtMoney(v){if(v==null||isNaN(v))return'0.00';var s=Math.abs(v).toFixed(2);return (v<0?'-':'')+s.replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function fmtDate(iso){var s=dkey(iso);if(!s)return'';return s.slice(5).replace('-','月')+'日';}
function uid(r){return r&&r._id?r._id:null;}

/* ============ 数据读写（资料库 SDK） ============ */
function loadAll(key){
  return new Promise(function(resolve,reject){
    if(!db()){reject(new Error('离线环境：需在资料库内打开以同步数据'));return;}
    var acc=[],guard=0;
    function page(cursor){
      if(guard>100){resolve(acc);return;}
      var p={databaseId:DB[key],pageSize:200,startCursor:cursor};
      db().query(p).then(function(r){
        acc=acc.concat((r&&r.results)||[]);
        var next=r&&r.nextCursor;
        if(r&&r.hasMore&&next&&next!==cursor&&((r.results)||[]).length){guard++;page(next);}
        else resolve(acc);
      }).catch(reject);
    }
    page(undefined);
  });
}
function loadTable(key){
  return loadAll(key).then(function(rows){store[key]=rows;errState[key]=false;return rows;});
}
function commit(key,promise){
  if(!db()){toast('当前环境无法写入，请在资料库内打开','err');return Promise.reject();}
  return promise.then(function(){return loadTable(key);})
    .then(function(){afterChange();toast('已保存','ok');})
    .catch(function(e){console.error('[write]',key,e);toast('保存失败，请检查网络后重试','err');});
}
function addRec(key,props){return db().addRecord({databaseId:DB[key],properties:props});}
function updRec(key,id,props){return db().updateRecord({databaseId:DB[key],recordId:id,properties:props});}
function delRec(key,id){return db().deleteRecord({databaseId:DB[key],recordId:id});}

/* ============ 同步状态 & Toast ============ */
function setSync(s){
  var el=document.getElementById('sync');var txt=document.getElementById('syncText');
  el.className='sync '+s;
  txt.textContent = s==='ok'?'已同步' : s==='loading'?'同步中' : s==='error'?'同步异常·重试' : '同步中';
  el.onclick = s==='error' ? function(){bootLoad();} : null;
}
var toastTimer;
function toast(msg,type){
  var t=document.getElementById('toast');t.textContent=msg;t.className='show '+(type||'');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.className='';},2200);
}
function afterChange(){renderCurrent();}

/* ============ 图表（内联 SVG） ============ */
function donut(data,size){
  size=size||180;var r=size/2-16,cx=size/2,cy=size/2,total=0;
  data.forEach(function(d){total+=d.value;});
  if(total<=0)return '<svg viewBox="0 0 '+size+' '+size+'"><text x="50%" y="52%" text-anchor="middle" fill="'+C.muted+'" font-size="13">暂无支出</text></svg>';
  var circ=2*Math.PI*r,off=0,segs='';
  data.forEach(function(d){var frac=d.value/total,len=frac*circ;
    segs+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+d.color+'" stroke-width="15" stroke-dasharray="'+len.toFixed(2)+' '+(circ-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    off+=len;});
  var pct=Math.round((data[0]?data[0].value:0)/total*100);
  return '<svg viewBox="0 0 '+size+' '+size+'"><g>'+segs+'</g><text x="50%" y="47%" text-anchor="middle" fill="'+C.ink+'" font-size="22" font-weight="600">'+pct+'%</text><text x="50%" y="62%" text-anchor="middle" fill="'+C.muted+'" font-size="11">最大占比</text></svg>';
}
function bar2(a,b){
  var max=Math.max(a,b,1);
  function col(v,lab,col){var h=v/max*120;return '<div style="flex:1;text-align:center"><div style="height:120px;display:flex;align-items:flex-end;justify-content:center"><div style="width:46px;background:'+col+';border-radius:8px 8px 0 0;height:'+h+'px;transition:.5s"></div></div><div style="margin-top:8px;font-size:13px;font-weight:600">'+fmtMoney(v)+'</div><div style="font-size:11px;color:'+C.muted+'">'+lab+'</div></div>';}
  return '<div style="display:flex;gap:24px;align-items:flex-end;justify-content:center;padding:6px 0">'+col(a,'本月',C.accent)+col(b,'上月','#C9BBA8')+'</div>';
}
function lineChart(pts,avg,size){
  size=size||{w:560,h:180};
  if(pts.length<2)return '<svg viewBox="0 0 '+size.w+' '+size.h+'"><text x="50%" y="50%" text-anchor="middle" fill="'+C.muted+'" font-size="13">记录 2 天以上可看趋势</text></svg>';
  var w=size.w,h=size.h,padL=34,padB=22,padT=14,padR=10;
  var xs=pts.map(function(p){return p.x}),ys=pts.map(function(p){return p.y}).concat(avg||[]);
  var minY=Math.min.apply(null,ys),maxY=Math.max.apply(null,ys);
  if(maxY-minY<0.1){maxY+=0.5;minY-=0.5;}
  var rng=maxY-minY;
  function X(i){return padL+(w-padL-padR)*(i/(pts.length-1));}
  function Y(v){return padT+(h-padT-padB)*(1-(v-minY)/rng);}
  var dpts=pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1);}).join(' ');
  var davg=avg?avg.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p).toFixed(1);}).join(' '):'';
  var gl='';
  for(var g=0;g<=3;g++){var gy=padT+(h-padT-padB)*g/3;var gv=(maxY-rng*g/3).toFixed(1);gl+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(w-padR)+'" y2="'+gy+'" stroke="'+C.line+'" stroke-width="1"/><text x="4" y="'+(gy+3)+'" fill="'+C.muted+'" font-size="10">'+gv+'</text>';}
  var area='M'+X(0).toFixed(1)+' '+(h-padB)+' '+pts.map(function(p,i){return 'L'+X(i).toFixed(1)+' '+Y(p.y).toFixed(1);}).join(' ')+' L'+X(pts.length-1).toFixed(1)+' '+(h-padB)+' Z';
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto">'+
    gl+'<path d="'+area+'" fill="'+C.accent+'" opacity="0.08"/>'+
    (davg?'<path d="'+davg+'" fill="none" stroke="'+C.blue+'" stroke-width="1.5" stroke-dasharray="4 3"/>':'')+
    '<path d="'+dpts+'" fill="none" stroke="'+C.accent+'" stroke-width="2.2" stroke-linejoin="round"/>'+
    pts.map(function(p,i){return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3" fill="#fff" stroke="'+C.accent+'" stroke-width="1.6"/>';}).join('')+
    '</svg>';
}

/* 连续天数 / 30天热力 */
function habitStreak(hab){
  // 结束于今天(若今天未完成则止于昨天) 的连续完成天数
  var name=hab['名称'];var mode=hab['方式'];
  var end=todayStr();
  var logs=store.habitlog.filter(function(r){return r['习惯']===name;});
  function doneOn(d){var l=logs.find(function(r){return dkey(r['日期'])===d;});if(!l)return false;
    if(mode==='勾选')return !!l['完成'];
    return (parseFloat(l['数值'])>0);}
  var d=todayStr();
  if(!doneOn(d))d=addDays(d,-1);
  var streak=0;
  while(doneOn(d)){streak++;d=addDays(d,-1);if(streak>3650)break;}
  return streak;
}
function habitRate(hab){
  var name=hab['名称'];var mode=hab['方式'];
  var logs=store.habitlog.filter(function(r){return r['习惯']===name;});
  var cnt=0;logs.forEach(function(r){if(mode==='勾选'){if(r['完成'])cnt++;}else{if(parseFloat(r['数值'])>0)cnt++;}});
  return logs.length?Math.round(cnt/logs.length*100):0;
}
function heatCells(hab){
  var name=hab['名称'];var mode=hab['方式'];var target=parseFloat(hab['目标'])||1;
  var logs=store.habitlog.filter(function(r){return r['习惯']===name;});
  var cells=[];
  for(var i=29;i>=0;i--){var d=addDays(todayStr(),-i);var l=logs.find(function(r){return dkey(r['日期'])===d;});
    var lv=0;
    if(l){if(mode==='勾选'){lv=l['完成']?4:0;}else{var v=parseFloat(l['数值'])||0;var r=v/target;lv=r>=1?4:r>=0.66?3:r>=0.33?2:r>0?1:0;}}
    cells.push(lv);
  }
  return cells;
}

function stat(k,v,cls){return '<div class="stat"><div class="k">'+k+'</div><div class="v '+(cls||'')+'">'+v+'</div></div>';}
function greet(){var h=new Date().getHours();var g=h<6?'夜深了':h<11?'早安':h<14?'午安':h<18?'下午好':'晚上好';return '<b>'+g+'</b> · '+new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});}
function bmiCat(b){if(b<18.5)return'偏瘦';if(b<24)return'正常';if(b<28)return'偏胖';return'肥胖';}
function recentTimeline(){
  var items=[];
  (store.finance||[]).forEach(function(r){items.push({d:dkey(r['日期']),k:'财务',t:(r['类型']==='收入'?'+':'-')+'¥'+fmtMoney(r['金额'])+' · '+esc(r['分类'])+(r['备注']?'（'+esc(r['备注'])+'）':'')});});
  (store.habitlog||[]).forEach(function(r){items.push({d:dkey(r['日期']),k:'习惯',t:esc(r['习惯'])+' 打卡'});});
  (store.fitness||[]).forEach(function(r){items.push({d:dkey(r['日期']),k:'健康',t:'体重 '+r['体重']+'kg'+(r['体脂']!=null?' · 体脂 '+r['体脂']+'%':'')});});
  (store.schedule||[]).forEach(function(r){items.push({d:dkey(r['日期']),k:'日程',t:esc(r['标题'])});});
  (store.wishlist||[]).forEach(function(r){items.push({d:todayStr(),k:'待买',t:'想买 '+esc(r['名称'])});});
  (store.media||[]).forEach(function(r){items.push({d:todayStr(),k:'收藏',t:'《'+esc(r['标题'])+'》'+esc(r['状态'])});});
  items.sort(function(a,b){return a.d<b.d?1:-1;});
  items=items.slice(0,9);
  if(!items.length)return '<div class="empty">还没有任何记录，去各个模块添加第一条吧。</div>';
  var html='<div class="timeline">';
  items.forEach(function(it){html+='<div class="tl-item"><div class="tl-d">'+it.d+' · '+it.k+'</div><div class="tl-t">'+it.t+'</div></div>';});
  html+='</div>';return html;
}

/* ===== 减脂健身 ===== */
RENDER.fitness=function(){
  var el=document.getElementById('view-fitness');
  if(errState.fitness===true){el.innerHTML=errHTML('fitness','身体记录');return;}
  var h0=goalVal('身高');var tw=goalVal('目标体重');
  var fit=(store.fitness||[]).slice().sort(function(a,b){return dkey(a['日期'])<dkey(b['日期'])?-1:1;});
  var last=fit.length?fit[fit.length-1]:null;var start=fit.length?fit[0]:null;
  var lastW=last&&last['体重']!=null?last['体重']:null;
  var bmi=(lastW&&h0)?(lastW/Math.pow(h0/100,2)):null;
  var gap=(last&&last['消耗']!=null&&last['摄入']!=null)?(last['消耗']-last['摄入']):null;
  var prog=null;
  if(lastW!=null&&tw!=null&&start&&start['体重']!=null){
    if(start['体重']>tw)prog=(start['体重']-lastW)/(start['体重']-tw)*100;
    else prog=(lastW-start['体重'])/(tw-start['体重'])*100;
    prog=Math.max(0,Math.min(100,prog));
  }
  var arr=fit.filter(function(r){return r['体重']!=null;}).map(function(r){return {d:dkey(r['日期']),w:r['体重']};});
  var pts=arr.map(function(o,i){return {x:i,y:o.w};});
  var avg=arr.map(function(o,i){var s=0,c=0;for(var j=Math.max(0,i-6);j<=i;j++){s+=arr[j].w;c++;}return s/c;});

  var html='';

  html+='<div class="field"><label>运动 分钟</label><input name="ex" type="number" step="1" inputmode="numeric" placeholder="35"></div>';
  html+='</div><div class="form-actions"><button class="btn" type="submit">保存记录</button></div></form></div>';

  // 目标 & 指标

  html+=stat('当前体重',lastW!=null?lastW+'<small>kg</small>':'—','');
  html+=stat('BMI',bmi?bmi.toFixed(1)+' <span class="pill" style="font-size:10px">'+bmiCat(bmi)+'</span>':'—','');
  html+=stat('热量缺口',gap!=null?(gap>=0?'+':'')+gap+'<small>kcal</small>':'—',gap!=null?(gap>=0?'pos':'neg'):'');

  html+='<div class="card"><div class="field" style="margin-bottom:10px"><label>目标进度'+(tw?('（目标 '+tw+'kg）'):'')+'</label></div>'+
    (prog!=null?'<div class="bar green"><i style="width:'+prog.toFixed(0)+'%"></i></div><div class="s" style="font-size:12px;color:var(--muted);margin-top:8px">起点 '+start['体重']+'kg · 当前 '+lastW+'kg</div>':'<div class="muted" style="font-size:12.5px">在下方设置目标体重后显示进度</div>')+'</div>';

  html+='</div>';

  // 目标设置
  html+='<div class="card" style="margin-top:14px"><div class="section-title" style="margin:0 0 14px"><h2>目标设置</h2><span class="en">Goal</span></div>';

/* ===== 日程统筹 ===== */
function groupSchedule(){
  var t=todayStr();var items=store.schedule||[];var f=state.schFilter;
  if(f==='待完成')items=items.filter(function(r){return r['状态']!=='已完成';});
  else if(f==='已完成')items=items.filter(function(r){return r['状态']==='已完成';});
  var groups=[];
  if(f!=='已完成'){
    var overdue=items.filter(function(r){return dkey(r['日期'])<t;});
    var todayI=items.filter(function(r){return dkey(r['日期'])===t;});
    var tmr=items.filter(function(r){return dkey(r['日期'])===addDays(t,1);});
    var wk=items.filter(function(r){var d=dkey(r['日期']);return d>t&&d!==addDays(t,1)&&d<=addDays(t,7);});
    var early=items.filter(function(r){var d=dkey(r['日期']);return d>addDays(t,7);});
    if(overdue.length)groups.push(['逾期',overdue,true]);
    if(todayI.length)groups.push(['今天',todayI,false]);
    if(tmr.length)groups.push(['明天',tmr,false]);
    if(wk.length)groups.push(['未来 7 天',wk,false]);
    if(early.length)groups.push(['更往后',early,false]);
  }
  if(f!=='待完成'){
    var done=items.filter(function(r){return r['状态']==='已完成';});
    if(done.length)groups.push(['已完成',done,false]);
  }
  return groups;
}

/* ============ 一键导出全部数据（备份到本地 JSON） ============ */
function exportAll(){
  if(!db()){toast('请在资料库环境中打开以导出','err');return;}
  var keys=['finance','budget','habits','habitlog','fitness','goal','schedule','wishlist','media','workout'];
  var names={finance:'记账流水',budget:'月度预算',habits:'习惯定义',habitlog:'习惯打卡',fitness:'身体记录',goal:'目标设置',schedule:'日程安排',wishlist:'待买清单',media:'书影音收藏',workout:'健身周计划'};
  var out={_meta:{app:'日常集·生活工作台',exportedAt:new Date().toISOString(),source:'workbuddy-library'},data:{}};
  var pending=keys.length,done=0;
  toast('正在导出云端数据…');
  keys.forEach(function(k){
    Promise.resolve().then(function(){return db().query(k);}).then(function(rows){
      out.data[k]={name:names[k],rows:rows||[]};
    }).catch(function(e){
      out.data[k]={name:names[k],error:String((e&&e.message)||e)};
    }).then(function(){
      done++;
      if(done===pending){
        var blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
        var url=URL.createObjectURL(blob);
        var a=document.createElement('a');
        a.href=url;a.download='日常集数据备份_'+new Date().toISOString().slice(0,10)+'.json';
        document.body.appendChild(a);a.click();document.body.removeChild(a);
        setTimeout(function(){URL.revokeObjectURL(url);},1000);
        toast('已导出 '+keys.length+' 张表到本地','ok');
      }
    });
  });
}
/*__MODULES__*/

/* ============ 启动 ============ */
function bootLoad(){
  if(!db()){setSync('error');toast('请在资料库环境中打开以同步数据','err');
    ['finance','budget','habits','habitlog','fitness','goal','schedule','wishlist','media','workout'].forEach(function(k){errState[k]=true;});
    renderCurrent();return;}
  setSync('loading');
  var keys=Object.keys(DB);var pend=0;
  keys.forEach(function(k){
    loadTable(k).catch(function(e){errState[k]=true;console.error('load',k,e);}).then(function(){
      pend++;if(pend>=keys.length){var any=keys.some(function(x){return errState[x];});setSync(any?'error':'ok');renderCurrent();}
    });
  });
}
document.getElementById('viewDate').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
if(db()&&typeof db().onUpdated==='function'){
  db().onUpdated(function(payload){
    var ids=(payload&&payload.databaseIds)||[];
    var touched=ids.filter(function(id){return Object.keys(DB).some(function(k){return DB[k]===id;});});
    if(!touched.length)return;
    Promise.all(touched.map(function(id){var k=Object.keys(DB).find(function(x){return DB[x]===id;});return loadTable(k);})).then(function(){toast('数据已更新','ok');renderCurrent();}).catch(function(){});
  });
}
bootLoad();

})();
